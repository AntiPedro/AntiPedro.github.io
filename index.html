const av=(n,c="")=>{const k=String(n).toLowerCase();if(ICONS[k])return `<img class="av ${c}" src="${ICONS[k]}" alt="" width="32" height="32">`;let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return `<span class="av ${c}" style="background:${AVC[h%AVC.length]};border-color:transparent;color:#fff">${esc(ini(n))}</span>`};
const tn=id=>teams.find(t=>t.id==id)?.name||"?",ini=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const tm=n=>`<span class="tm" title="${esc(n)}">${av(n)}<span class="nm">${esc(n)}</span></span>`;
const played=x=>x.status=="finished"&&x.home_score!=null&&x.away_score!=null;
const noScore=x=>x.status=="finished"&&(x.home_score==null||x.away_score==null);
const score=x=>x.status=="scheduled"?"vs":noScore(x)?"? - ?":`${x.home_score??0} - ${x.away_score??0}`;
const tms=x=>x.match_time?+new Date(x.match_time):0;
const byTime=(a,b)=>(a.match_time?tms(a):Infinity)-(b.match_time?tms(b):Infinity)||a.round-b.round||a.id-b.id;
function standings(){
 const r={};teams.forEach(t=>r[t.id]={id:t.id,name:t.name,o:0,g:0,b:0,m:0,a:0,y:0,f:[]});
 matches.filter(played).forEach(x=>{const h=r[x.home_id],a=r[x.away_id];if(!h||!a)return;
  h.o++;a.o++;h.a+=x.home_score;h.y+=x.away_score;a.a+=x.away_score;a.y+=x.home_score;
  const[hr,ar]=x.home_score>x.away_score?["G","M"]:x.home_score<x.away_score?["M","G"]:["B","B"];
  h[{G:"g",B:"b",M:"m"}[hr]]++;a[{G:"g",B:"b",M:"m"}[ar]]++;h.f.push(hr);a.f.push(ar)});
 return Object.values(r).map(t=>({...t,av:t.a-t.y,p:t.g*3+t.b})).sort((x,y)=>y.p-x.p||y.av-x.av||y.a-x.a||x.name.localeCompare(y.name,"tr"));
}
const form=f=>`<span class="form">${f.slice(-5).map(c=>`<i class="f${c}">${c}</i>`).join("")}</span>`;
const when=x=>x.match_time?new Date(x.match_time).toLocaleString("tr-TR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const status=x=>x.status=="live"?`<span class="badge b-er"><span class="dot pulse"></span>CANLI ${x.minute??""}'</span>`:x.status=="finished"?(noScore(x)?`<span class="badge b-wa">Skor girilmedi</span>`:`<span class="badge">Maç sonu</span>`):`<span class="badge b-in">Planlandı${when(x)?" · "+when(x):""}</span>`;
function mc(x){return `<div class="mc mr" role="button" tabindex="0" data-k onclick="detail(${x.id})">${tm(tn(x.home_id))}<div class="sc">${score(x)}</div>${tm(tn(x.away_id))}<div class="mm">${status(x)}${x.full_url||x.highlights_url?'<span>🎥 Video</span>':""}</div></div>`}
const meter=(l,v,max,suf="")=>`<div class="meter"><div class="mh"><span>${l}</span><span>${v}${suf}</span></div><div class="mb"><div style="width:${max?Math.min(100,Math.round(v/max*100)):0}%"></div></div></div>`;
const rowv=(l,v)=>`<div class="row"><span>${l}</span><span>${v}</span></div>`;

 const last=pl.slice().sort((a,b)=>b.round-a.round||tms(b)-tms(a)||b.id-a.id).slice(0,5),L=s[0]&&s[0].o?s[0]:null;

function mac(){

window.tmatchForm=id=>{
 const myTeamId=teamProfile?.team_id;

 const x=id?matches.find(m=>m.id==id):{round:Math.max(1,...matches.map(m=>m.round||1)),status:"scheduled",approval_status:"pending"};
 const isHome=id?(x.home_id==myTeamId):true;const myScore=isHome?(x.home_score??""):(x.away_score??"");const oppScore=isHome?(x.away_score??""):(x.home_score??"");

 openModal(`<div class="mhd"><div class="mt">${id?"Maçı düzenle":"Yeni maç önerisi"}</div><button class="x" aria-label="Kapat" onclick="closeM()">✕</button></div>

 <div class="fld"><label for="tm_mt">Tarih / saat</label><input class="in" id="tm_mt" type="datetime-local" value="${lt}"></div>
 <div class="fld"><label for="tm_fu">Tam maç linki (catbox)</label><input class="in" id="tm_fu" value="${esc(x.full_url)}" placeholder="https://files.catbox.moe/..."></div>
 <div class="fld"><label for="tm_hu">Özet linki (catbox)</label><input class="in" id="tm_hu" value="${esc(x.highlights_url)}"></div>
 <div class="mf"><button class="btn bs" onclick="closeM()">İptal</button><button class="btn bp" onclick="saveTMatch(${id??"null"})">Gönder</button></div>`);

  const m=matches.find(x=>x.id==id);

 }

window.saveTMatch=async id=>{
 const myTeamId=teamProfile.team_id;
 const oppId=+$("tm_opp").value;
 const existing=id?matches.find(m=>m.id==id):null;const isHome=existing?(existing.home_id==myTeamId):true;const home_id=isHome?myTeamId:oppId;const away_id=isHome?oppId:myTeamId;const home_score=isHome?nv($("tm_hs").value):nv($("tm_as").value);const away_score=isHome?nv($("tm_as").value):nv($("tm_hs").value);
 const r={home_id,away_id,home_score,away_score,round:nv($("tm_rd").value),status:"scheduled",approval_status:"pending",match_time:$("tm_mt").value?new Date($("tm_mt").value).toISOString():null,full_url:$("tm_fu").value.trim()||null,highlights_url:$("tm_hu").value.trim()||null,submitted_by:teamSession.user.id,submitted_at:new Date().toISOString()};
 if(busy)return;
 if(!oppId)return toast("Karşı takım seç",true);
 if(r.round==null||r.round<1)return toast("Hafta 1 veya daha büyük olmalı",true);
 for(const k of["home_score","away_score","round"])if(r[k]!=null&&(!Number.isInteger(r[k])||r[k]<0))return toast("Skor ve hafta tam sayı olmalı (0 veya üstü)",true);
 if(r.home_score!=null||r.away_score!=null){r.status="finished"}
 busy=true;
 const{error}=id?await sb.from("matches").update(r).eq("id",id):await sb.from("matches").insert(r);
 busy=false;
 if(error){
  if(error.code=="23505")return toast("Bu maç zaten gönderilmiş",true);
  return toast("Kaydedilemedi: "+error.message,true);
 }
 closeM();toast(id?"Güncellendi":"Öneri gönderildi, admin onayı bekleniyor");refresh()};

window.saveM=async id=>{const r={home_id:+$("h").value,away_id:+$("a").value,home_score:nv($("hs").value),away_score:nv($("as").value),round:nv($("rd").value),status:$("st").value,approval_status:$("ap").value,minute:nv($("mn").value),match_time:$("mt").value?new Date($("mt").value).toISOString():null,full_url:$("fu").value.trim()||null,highlights_url:$("hu").value.trim()||null};
 if(busy)return;
 if(r.home_id==r.away_id)return toast("Aynı takım seçilemez",true);
 if(r.round==null||r.round<1)return toast("Hafta 1 veya daha büyük olmalı",true);
 for(const k of["home_score","away_score","minute","round"])if(r[k]!=null&&(!Number.isInteger(r[k])||r[k]<0))return toast("Skor, dakika ve hafta tam sayı olmalı (0 veya üstü)",true);
 if(r.status=="scheduled"&&(r.home_score!=null||r.away_score!=null))return toast("Planlanan maçta skor olamaz",true);
 if(r.status=="finished"&&(r.home_score==null||r.away_score==null))return toast("Biten maç için iki skoru da gir",true);
 if(r.status=="live"){r.home_score??=0;r.away_score??=0}
 busy=true;const{error}=id!=null?await sb.from("matches").update(r).eq("id",id):await sb.from("matches").insert(r);busy=false;
 if(error)return toast("Kaydedilemedi: "+error.message,true);closeM();toast("Kaydedildi");refresh()};

window.addT=async()=>{const n=$("tname").value.trim();if(!n)return;if(teams.some(t=>t.name.toLowerCase()==n.toLowerCase()))return toast("Bu isimde bir takım zaten var",true);const{error}=await sb.from("teams").insert({name:n});error?toast("Eklenemedi: "+error.message,true):(toast("Takım eklendi"),refresh())};

window.doSignup=async()=>{

 }
 toast("Kayıt başarılı! Giriş yapabilirsiniz.");location.hash="login";
};
window.doLogin=async()=>{

let lastF=null;
function openModal(h){if(!$("ov").classList.contains("show"))lastF=document.activeElement;const m=$("mo");m.innerHTML=h;m.setAttribute("aria-label",m.querySelector(".mt")?.textContent||"Pencere");$("ov").classList.add("show");m.focus()}
window.closeM=()=>{if(!$("ov").classList.contains("show"))return;$("ov").classList.remove("show");if(lastF&&lastF.isConnected)lastF.focus()};
$("ov").onclick=e=>{if(e.target==$("ov"))closeM()};addEventListener("keydown",e=>{
 if(e.key=="Escape")return closeM();
 if(e.key=="Tab"&&$("ov").classList.contains("show")){const mo=$("mo"),f=[...mo.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,video[controls]')].filter(n=>n.offsetParent!==null);if(!f.length){e.preventDefault();return mo.focus()}
  const a=document.activeElement,first=f[0],last=f[f.length-1];
  if(e.shiftKey&&(a===first||a===mo)){e.preventDefault();last.focus()}else if(!e.shiftKey&&a===last){e.preventDefault();first.focus()}else if(!mo.contains(a)){e.preventDefault();first.focus()}return}
 if((e.key=="Enter"||e.key==" ")&&e.target.matches&&e.target.matches("[data-k]")){e.preventDefault();e.target.click()}
});
function toast(t,err){const e=document.createElement("div");e.className="toast"+(err?" er":"");e.textContent=t;$("ts").append(e);setTimeout(()=>e.remove(),err?6000:3500)}

const V={home,lig,mac,tak,adm,signup,login:loginPage,team};
function render(force){
 const ae=document.activeElement;
 if(!force&&ae&&ae.closest&&ae.closest("#app")&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
 const fk=ae&&ae.dataset&&ae.dataset.f&&!ae.closest("#mo")?ae.dataset.f:null;
 let navItems=NAV_PUBLIC;
 if(teamSession)navItems=[...navItems,...NAV_TEAM];
 if(session)navItems=[...navItems,...NAV_ADMIN];
 if(!session&&!teamSession)navItems=[...navItems,["signup","Kayıt Ol"],["login","Giriş"]];
 $("nav").innerHTML=`<div class="logo">ATP<span> / Cup</span></div>`+navItems.map(([k,l])=>`<a class="nv ${page==k?"on":""}" ${page==k?'aria-current="page"':""} data-f="nav-${k}" href="#${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${I[k]}"/></svg>${l}</a>`).join("");
 const banner=(configured?"":`<div class="alert">Demo modu — Supabase ayarlanmadı, gömülü verilerle çalışıyor.</div>`)+(loadErr?`<div class="alert" role="alert" style="background:var(--erb);color:var(--er)">${esc(loadErr)} <button class="btn bg sm" data-f="retry" style="margin-left:8px" onclick="refresh()">Tekrar dene</button></div>`:"");
 $("app").innerHTML=banner+(loading?`<div class="card empty"><b>Yükleniyor…</b>Lig verileri getiriliyor.</div>`:(V[page]||home)());
 $("app").setAttribute("aria-busy",loading);
 document.title=(NAV_PUBLIC.find(n=>n[0]==page)||NAV_TEAM.find(n=>n[0]==page)||NAV_ADMIN.find(n=>n[0]==page)||["","ATP Cup"])[1]+" · ATP Cup";
 if(fk)document.querySelector(`[data-f="${fk}"]`)?.focus();
}
async function refresh(){await load();render()}
function route(){page=getPage();render(true);window.scrollTo(0,0);$("app").focus({preventScroll:true})}
addEventListener("hashchange",route);
(async()=>{render(true);
  if(sb){
   try{
    // Session'ı DAİM koru - sadece explicit logout temizler
    const applySession=async(s)=>{
     if(!s?.user){
      // Sadece real logout gelirse temizle
      session=null;teamSession=null;teamProfile=null;return
     }
     // Admin kontrolü (best effort, hata olsa bile session kalsın)
     let isAdmin=false;
     try{const{data:a}=await sb.rpc("is_admin");isAdmin=!!a}catch(e){}
     if(isAdmin){session=s;teamSession=null;teamProfile=null;return}
     // Admin değilse team üyesi - her durumda session KALSIN
     teamSession=s;session=null;
     try{const{data:mem}=await sb.from("team_members").select("*").eq("user_id",s.user.id).maybeSingle();teamProfile=mem||null}catch(e){teamProfile=null}
    };
    // İlk yükleme
    const init=await sb.auth.getSession();
    await applySession(init.data.session);
    // Auth state değişince - session VARSA her durumda koru
    sb.auth.onAuthStateChange(async(_,s)=>{await applySession(s);render(true)});
    // Realtime debounce
    let rt=null;
    sb.channel("live").on("postgres_changes",{event:"*",schema:"public",table:"matches"},()=>{if(rt)clearTimeout(rt);rt=setTimeout(refresh,300)}).subscribe();
   }catch(e){console.error("Init error:",e)}
  }
  await load();render(true)})();
</script></body></html>
